  /* ekip-cevrilen-kart — Bilgi iki yüze bölünür (flip): ön yüz sade kalır, ayrıntı etkileşimle açılır; dokunmatikte düğme ile çalışır. */

  .modulex-ekip-cevrilen-kart *, .modulex-ekip-cevrilen-kart *::before, .modulex-ekip-cevrilen-kart *::after { box-sizing: border-box; }
  /* ham/css.css «* { font-size: 14px }» kalıtımı keser — modül içinde boyut üstten gelsin (ikon yazı tipi hariç) */
  .modulex-ekip-cevrilen-kart :where(*:not(.material-symbols-outlined)) { font-size: inherit; }
  /* aynı «*» kuralı font-weight 400 · line-height 1.2 · font-family de basar — modül içinde kalıtım */
  .modulex-ekip-cevrilen-kart :where(*:not(.material-symbols-outlined)) { font-weight: inherit; line-height: inherit; font-family: inherit; }

  .modulex-ekip-cevrilen-kart-metin { color: --muted--; font-size: 1.05rem; line-height: 1.7; }
  .modulex-ekip-cevrilen-kart-bas { max-width: 780px; margin-inline: auto; text-align: center; justify-items: center; }
  .modulex-ekip-cevrilen-kart-cta { display: flex; flex-wrap: wrap; gap: 12px; margin-block-start: 8px; }
  .modulex-ekip-cevrilen-kart-dugme { display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 12px 22px; border: 2px solid --accent--; border-radius: 999px; background: --accent--; color: --accentText--; font-weight: 700; text-decoration: none; transition: transform 0.25s ease, background 0.25s ease, color 0.25s ease; }

  .modulex-ekip-cevrilen-kart-dugme--ikincil:hover { border-color: --accent--; }
  .modulex-ekip-cevrilen-kart-dugme .material-symbols-outlined { font-size: 20px; }

  .modulex-ekip-cevrilen-kart-izgara { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 250px), 1fr)); gap: 28px; }
  .modulex-ekip-cevrilen-kart-kap { position: relative; display: grid; gap: 12px; perspective: 1400px; }
  .modulex-ekip-cevrilen-kart-kart { display: grid; transform-style: preserve-3d; transition: transform 0.8s cubic-bezier(0.2, 0.8, 0.2, 1); }
  .modulex-ekip-cevrilen-kart-on, .modulex-ekip-cevrilen-kart-arka { grid-area: 1 / 1; display: grid; border-radius: --yuvarlak--; backface-visibility: hidden; -webkit-backface-visibility: hidden; overflow: hidden; }
  .modulex-ekip-cevrilen-kart-on { grid-template-rows: auto 1fr; background-color: --kartBg--; }
  .modulex-ekip-cevrilen-kart-arka { align-content: center; gap: 12px; padding: 26px; background-color: --vurguBg--; color: --vurguText--; transform: rotateY(180deg); }
  .modulex-ekip-cevrilen-kart-arka .modulex-ekip-cevrilen-kart-bio, .modulex-ekip-cevrilen-kart-arka .modulex-ekip-cevrilen-kart-unvan { color: inherit; }
  .modulex-ekip-cevrilen-kart-arka .modulex-ekip-cevrilen-kart-slink { border-color: currentColor; }
  .modulex-ekip-cevrilen-kart-arka-ad { font-size: 1.2rem; font-weight: 750; }
  .modulex-ekip-cevrilen-kart-foto { width: 100%; aspect-ratio: 6 / 7; object-fit: cover; font-size: 3rem; }
  .modulex-ekip-cevrilen-kart-onbilgi { display: grid; gap: 4px; padding: 16px 18px 20px; }
  .modulex-ekip-cevrilen-kart-kap:has(.modulex-ekip-cevrilen-kart--acik) .modulex-ekip-cevrilen-kart-kart { transform: rotateY(180deg); }
  @media (hover: hover) {
    .modulex-ekip-cevrilen-kart-kap:hover .modulex-ekip-cevrilen-kart-kart { transform: rotateY(180deg); }
  }
  .modulex-ekip-cevrilen-kart-cevir { display: inline-flex; align-items: center; justify-self: center; gap: 6px; min-height: 40px; padding: 6px 16px; border: 1px solid --cizgi--; border-radius: 999px; background: transparent; color: --text--; font: inherit; font-size: 0.9rem; font-weight: 650; transition: border-color 0.25s ease; }
  .modulex-ekip-cevrilen-kart-cevir:hover { border-color: --accent--; }
  .modulex-ekip-cevrilen-kart-cevir .material-symbols-outlined { font-size: 18px; }
  @media (max-width: 768px) {
    .modulex-ekip-cevrilen-kart-izgara { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px 12px; }
    .modulex-ekip-cevrilen-kart-onbilgi { padding: 10px 12px 14px; }
    .modulex-ekip-cevrilen-kart-ad { font-size: 0.98rem; }
    .modulex-ekip-cevrilen-kart-unvan { font-size: 0.82rem; }
    .modulex-ekip-cevrilen-kart-arka { gap: 8px; padding: 14px; }
    .modulex-ekip-cevrilen-kart-arka-ad { font-size: 1rem; }
    .modulex-ekip-cevrilen-kart-arka .modulex-ekip-cevrilen-kart-bio { font-size: 0.82rem; line-height: 1.5; }
    .modulex-ekip-cevrilen-kart-slink { min-width: 34px; min-height: 34px; padding: 0 6px; }
    .modulex-ekip-cevrilen-kart-cevir { font-size: 0.82rem; padding: 4px 12px; }
  }
  /* img width/height öznitelikleri CSS yüksekliği olur — aspect-ratio'nun çalışması için yükseklik auto (modül kuralı ezebilir) */
  :where(.modulex-ekip-cevrilen-kart) img { height: auto; }
  .modulex-ekip-cevrilen-kart-foto { min-width: 0; }
  .modulex-ekip-cevrilen-kart-bag { color: inherit; text-decoration: none; }
  .modulex-ekip-cevrilen-kart-bag:hover { text-decoration: underline; text-underline-offset: 4px; }
  .modulex-ekip-cevrilen-kart-harf { display: grid; place-items: center; background-color: --vurguBg--; color: --vurguText--; font-weight: 800; letter-spacing: 0.02em; }
  .modulex-ekip-cevrilen-kart-sosyal { display: flex; flex-wrap: wrap; gap: 8px; }
  .modulex-ekip-cevrilen-kart-slink { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-width: 40px; min-height: 40px; padding: 0 10px; border: 1px solid --cizgi--; border-radius: 999px; color: inherit; font-size: 0.88rem; text-decoration: none; transition: background-color 0.25s ease, color 0.25s ease, border-color 0.25s ease; }
  .modulex-ekip-cevrilen-kart-slink:hover { background-color: --accent--; border-color: --accent--; color: --accentText--; }
  .modulex-ekip-cevrilen-kart-slink .material-symbols-outlined { font-size: 19px; }
  .modulex-ekip-cevrilen-kart-syazi { overflow-wrap: anywhere; }
  .modulex-ekip-cevrilen-kart-ad { font-size: 1.12rem; font-weight: 750; line-height: 1.3; }
  .modulex-ekip-cevrilen-kart-unvan { color: --accentInk--; font-size: 0.92rem; font-weight: 650; }
  .modulex-ekip-cevrilen-kart-bio { color: --muted--; font-size: 0.95rem; line-height: 1.65; }
  .modulex-ekip-cevrilen-kart-bolum { color: --muted--; font-size: 0.78rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; }

  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-ekip-cevrilen-kart :is(.modulex-ekip-cevrilen-kart-baslik, .modulex-ekip-cevrilen-kart-ust, h3, h4, strong) { letter-spacing: 0; }
  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-ekip-cevrilen-kart-baslik { line-height: 1.35; }
  @media (max-width: 768px) {
    .modulex-ekip-cevrilen-kart { padding-inline: 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .modulex-ekip-cevrilen-kart *, .modulex-ekip-cevrilen-kart *::before, .modulex-ekip-cevrilen-kart *::after { animation: none !important; transition: none !important; }
  }
</style>
<script>
  (() => {
    const P = "modulex-ekip-cevrilen-kart";
    const az = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
    const cevir = (s, P) => {
        s.querySelectorAll("[data-cevir]").forEach((k) => {
          const tog = () => { const a = k.classList.toggle(P + "--acik"); k.setAttribute("aria-expanded", String(a)); };
          k.addEventListener("click", (e) => { if (!e.target.closest("a")) tog(); });
          k.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); tog(); } });
        });
      };
    document.querySelectorAll("." + P).forEach((s) => {
      if (s.dataset.fbHazir) return;
      s.dataset.fbHazir = "1";
      cevir(s, P, az);
    });
  })();
</script>
